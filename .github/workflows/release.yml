name: Release APK
# Push a tag like v0.4.0 to build a signed APK and attach it to a GitHub Release.
# Needs repository secrets: ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
on:
  push: { tags: ['v*'] }
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check signing secrets
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Missing signing secrets. See README > Signed release."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx expo install --fix
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/zee.jks"
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/zee.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out zee-${{ github.ref_name }}.apk android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify zee-${{ github.ref_name }}.apk
          rm -f "$RUNNER_TEMP/zee.jks"
      - uses: softprops/action-gh-release@v2
        with: { files: 'zee-*.apk' }
